# Aurora messenger — nginx reverse proxy
# WebSocket services routed via ?XTransformPort=3003|3004 (same as former Caddy setup)
#
# After DNS A record → VPS IP, run on server:
#   AURORA_DOMAIN=your.domain.com bash /opt/aurora/scripts/enable-letsencrypt.sh
#
# Static upload caching (CDN-via-Cloudflare-Tunnel):
#   /uploads/videos/* and /uploads/images/* are served directly from disk by
#   nginx with long Cache-Control headers so Cloudflare's edge caches them.
#   The mp4 module enables pseudo-streaming (byte-range seeking) for .mp4
#   files. Install it on Debian/Ubuntu with:
#       apt-get install -y libnginx-mod-http-mp4
#   Then `nginx -t && systemctl reload nginx`.

map $arg_XTransformPort $aurora_upstream {
    default http://127.0.0.1:3000;
    3003    http://127.0.0.1:3003;
    3004    http://127.0.0.1:3004;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 210m;

    # Uploads root on disk. Override via include if you move the project dir.
    # Default Aurora VPS layout: /opt/aurora/public/uploads
    set $aurora_uploads_root /opt/aurora/public/uploads;

    # ---- Short videos: direct nginx serve + mp4 seeking + edge cache ----
    # Served from disk so the Node.js app doesn't have to read+pipe large
    # files. Cloudflare Tunnel caches these responses at the edge because of
    # the long `Cache-Control: public, immutable` header.
    location /uploads/videos/ {
        alias $aurora_uploads_root/videos/;
        autoindex off;

        # Pseudo-streaming for .mp4 (let users seek without downloading
        # the whole file). Requires libnginx-mod-http-mp4 — see header.
        location ~ \.mp4$ {
            mp4;
            mp4_buffer_size       1m;
            mp4_max_buffer_size   5m;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header Accept-Ranges "bytes" always;
        }

        # Non-mp4 video uploads (webm/mov/mkv/...): still long-cache at edge,
        # nginx serves byte-range requests natively.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Accept-Ranges "bytes" always;
    }

    # ---- Image uploads: long edge cache ----
    location /uploads/images/ {
        alias $aurora_uploads_root/images/;
        autoindex off;
        # avatars/gifts change rarely; 30 days at the edge is safe. The
        # filename is timestamp+uuid based so re-uploads produce new URLs.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Accept-Ranges "bytes" always;
    }

    # ---- Other uploads (voice/files/gifts/avatars): shorter cache ----
    # Kept proxied to the Next.js route (which already sets a 1-day cache)
    # so we don't have to enumerate every subdir here.
    location /uploads/ {
        proxy_pass $aurora_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Everything else: proxy to Next.js / mini-services ----
    location / {
        proxy_pass $aurora_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
