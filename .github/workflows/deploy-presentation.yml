name: Deploy presentation (GitHub Pages)

on:
  push:
    branches:
      - main
      - cursor/veschevaya-sluzhba-presentation-7df0
    paths:
      - "presentation/veschevaya-sluzhba/**"
      - ".github/workflows/deploy-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-presentation
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation/veschevaya-sluzhba

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
